services:
  app:
    image: ghcr.io/joycekua-intermediano/e-sign:latest
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - APP_NAME=${APP_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.intermediano-esign.loadbalancer.server.port=3000"
      - "traefik.http.routers.intermediano-esign.rule=Host(`esign.intermediano.com`)"
      - "traefik.http.routers.intermediano-esign.entrypoints=web"
      - "traefik.http.routers.intermediano-esign.middlewares=intermediano-esign-secheaders,intermediano-esign-ratelimit"
      # Security headers
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.frameDeny=true"
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.intermediano-esign-secheaders.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      # Rate limit per real visitor IP (behind the CF tunnel)
      - "traefik.http.middlewares.intermediano-esign-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.intermediano-esign-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.intermediano-esign-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.intermediano-esign-ratelimit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP"

networks:
  proxy:
    external: true
